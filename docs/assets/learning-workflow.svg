<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="525" viewBox="0 0 1120 525" role="img" aria-label="八阶段学习流程示意"><title>八阶段学习流程示意</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#617a9d"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="45" font-size="28" fill="#17304d" font-weight="700">从一个主题到一条学习路径</text><text x="30" y="79" font-size="19" fill="#17304d" font-weight="400">填写目标与基础 → 逐步生成 → 阅读确认 → 交给下一阶段</text><rect x="30" y="110" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="48" y="144" font-size="21" fill="#17304d" font-weight="650">01 五视角研究</text><text x="48" y="176" font-size="17" fill="#52627a" font-weight="400">建立不同立场</text><text x="48" y="203" font-size="17" fill="#52627a" font-weight="400">提出研究问题</text><path d="M272 174 L296 174" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="303" y="110" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="321" y="144" font-size="21" fill="#17304d" font-weight="650">02 矛盾图谱</text><text x="321" y="176" font-size="17" fill="#52627a" font-weight="400">梳理冲突与共识</text><text x="321" y="203" font-size="17" fill="#52627a" font-weight="400">发现知识盲区</text><path d="M545 174 L569 174" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="576" y="110" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="594" y="144" font-size="21" fill="#17304d" font-weight="650">03 综合简报</text><text x="594" y="176" font-size="17" fill="#52627a" font-weight="400">提炼关键发现</text><text x="594" y="203" font-size="17" fill="#52627a" font-weight="400">形成行动建议</text><path d="M818 174 L842 174" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="849" y="110" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="867" y="144" font-size="21" fill="#17304d" font-weight="650">04 同行评审</text><text x="867" y="176" font-size="17" fill="#52627a" font-weight="400">检查遗漏与偏差</text><text x="867" y="203" font-size="17" fill="#52627a" font-weight="400">提出补充方向</text><rect x="30" y="310" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="48" y="344" font-size="21" fill="#17304d" font-weight="650">05 资源筛选</text><text x="48" y="376" font-size="17" fill="#52627a" font-weight="400">安排资源顺序</text><text x="48" y="403" font-size="17" fill="#52627a" font-weight="400">估计时间投入</text><path d="M272 374 L296 374" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="303" y="310" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="321" y="344" font-size="21" fill="#17304d" font-weight="650">06 学习阶梯</text><text x="321" y="376" font-size="17" fill="#52627a" font-weight="400">拆分五级能力</text><text x="321" y="403" font-size="17" fill="#52627a" font-weight="400">明确晋级里程碑</text><path d="M545 374 L569 374" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="576" y="310" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="594" y="344" font-size="21" fill="#17304d" font-weight="650">07 二八学习计划</text><text x="594" y="376" font-size="17" fill="#52627a" font-weight="400">聚焦核心知识</text><text x="594" y="403" font-size="17" fill="#52627a" font-weight="400">安排练习和项目</text><path d="M818 374 L842 374" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="849" y="310" width="240" height="133" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="867" y="344" font-size="21" fill="#17304d" font-weight="650">08 自适应考试</text><text x="867" y="376" font-size="17" fill="#52627a" font-weight="400">生成自测材料</text><text x="867" y="403" font-size="17" fill="#52627a" font-weight="400">提出复习建议</text><path d="M969 245 L969 277 L150 277 L150 303" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="491" font-size="18" fill="#52627a" font-weight="400">每关都由用户确认后继续；第八关当前为文本生成，不是动态交互考试。</text></g></svg>