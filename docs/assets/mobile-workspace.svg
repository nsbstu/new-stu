<svg xmlns="http://www.w3.org/2000/svg" width="850" height="710" viewBox="0 0 850 710" role="img" aria-label="手机工作台与配置抽屉结构示意"><title>手机工作台与配置抽屉结构示意</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#617a9d"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="45" font-size="28" fill="#17304d" font-weight="700">手机单关工作台</text><text x="30" y="79" font-size="18" fill="#52627a" font-weight="400">结构示意 · 非产品截图</text><rect x="32" y="110" width="374" height="570" rx="26" fill="#10182b" stroke="#556783" stroke-width="2"/><text x="55" y="151" font-size="21" fill="#eaf0ff" font-weight="650">React 性能优化  ▾</text><text x="355" y="151" font-size="25" fill="#c3d2ec" font-weight="400">⚙</text><path d="M45 175 H393" stroke="#3d4f6c"/><text x="55" y="210" font-size="17" fill="#a4b5d0" font-weight="400">第 1 / 8 关</text><text x="55" y="246" font-size="24" fill="#eaf0ff" font-weight="650">五视角研究</text><rect x="55" y="269" width="102" height="43" rx="9" fill="#22314d"/><text x="86" y="298" font-size="18" fill="#eaf0ff" font-weight="400">任务</text><rect x="166" y="269" width="102" height="43" rx="9" fill="#465b9d"/><text x="197" y="298" font-size="18" fill="#eaf0ff" font-weight="400">成果</text><rect x="277" y="269" width="102" height="43" rx="9" fill="#22314d"/><text x="308" y="298" font-size="18" fill="#eaf0ff" font-weight="400">反思</text><rect x="55" y="335" width="326" height="220" rx="10" fill="#17233b"/><text x="74" y="372" font-size="20" fill="#eaf0ff" font-weight="650">本关成果</text><text x="74" y="408" font-size="18" fill="#b2c4df" font-weight="400">标题 · 表格 · 流程图</text><text x="74" y="449" font-size="17" fill="#b2c4df" font-weight="400">正文区域可以上下滚动</text><text x="74" y="489" font-size="17" fill="#b2c4df" font-weight="400">宽表格在内部左右滑动</text><rect x="45" y="579" width="348" height="85" rx="12" fill="#22314d"/><text x="60" y="602"