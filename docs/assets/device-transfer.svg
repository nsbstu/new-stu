<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="552" viewBox="0 0 1120 552" role="img" aria-label="PC与手机项目备份往返流程示意"><title>PC与手机项目备份往返流程示意</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#617a9d"/></marker></defs><rect width="100%" height="100%" fill="#f5f8fc"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="30" y="44" font-size="28" fill="#17304d" font-weight="700">一个项目在电脑与手机间继续</text><text x="30" y="78" font-size="19" fill="#52627a" font-weight="400">手动 JSON 迁移 · 保留项目 ID · 回导整份覆盖</text><rect x="30" y="110" width="300" height="122" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="48" y="144" font-size="21" fill="#17304d" font-weight="650">手机创建或导入项目</text><text x="48" y="176" font-size="17" fill="#52627a" font-weight="400">继续阅读、生成和确认</text><text x="48" y="203" font-size="17" fill="#52627a" font-weight="400">导出最新 JSON</text><path d="M335 172 L402 172" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="410" y="110" width="300" height="122" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="428" y="144" font-size="21" fill="#17304d" font-weight="650">电脑导入 JSON</text><text x="428" y="176" font-size="17" fill="#52627a" font-weight="400">先保存到浏览器</text><text x="428" y="203" font-size="17" fill="#52627a" font-weight="400">检查系统数据目录与权限</text><path d="M716 172 L782 172" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="790" y="110" width="300" height="122" rx="14" fill="#e9f0ff" stroke="#c6d3e4"/><text x="808" y="144" font-size="21" fill="#17304d" font-weight="650">按完整项目 ID 匹配</text><text x="808" y="176" font-size="17" fill="#52627a" font-weight="400">只查当前总目录的 projects/</text><text x="808" y="203" font-size="17" fill="#52627a" font-weight="400">匹配 project.json 内的 ID</text><path d="M940 237 L940 300" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="790" y="310" width="300" height="148" rx="14" fill="#ffffff" stroke="#c6d3e4"/><text x="808" y="344" font-size="21" fill="#17304d" font-weight="650">目录保存结果</text><text x="808" y="376" font-size="17" fill="#52627a" font-weight="400">有相同 ID → 更新原目录</text><text x="808" y="403" font-size="17" fill="#52627a" font-weight="400">没有相同 ID → 创建目录</text><text x="808" y="430" font-size="17" fill="#52627a" font-weight="400">无权限或未配置 → 浏览器保存</text><rect x="410" y="310" width="300" height="148" rx="14" fill="#ffffff" stroke="#c6d3e4"/><text x="428" y="344" font-size="21" fill="#17304d" font-weight="650">电脑继续学习后再导出</text><text x="428" y="376" font-size="17" fill="#52627a" font-weight="400">导出 JSON 传回手机</text><text x="428" y="403" font-size="17" fill="#52627a" font-weight="400">手机导入，接着学习</text><text x="428" y="430" font-size="17" fill="#52627a" font-weight="400">模型 API Key 需单独配置</text><path d="M785 382 L718 382" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M405 382 L180 382 L180 239" stroke="#617a9d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="30" y="520" font-size="19" fill="#52627a" font-weight="400">不是云同步，不自动合并两端内容；导入前确认使用的是最新备份。</text></g></svg>